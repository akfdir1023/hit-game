<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신희준 때리기</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            display: flex; flex-direction: column; align-items: center; 
            background-color: #f4f4f9; font-family: 'Pretendard', 'Malgun Gothic', sans-serif; 
            /* 모바일에서 더블 탭 확대 방지 */
            touch-action: manipulation; 
        }
        h2 { margin-top: 20px; color: #333; text-align: center; }
        
        #game-container { 
            position: relative; width: 100%; max-width: 400px; 
            text-align: center; margin-top: 10px; 
        }
        
        #photo-container { 
            position: relative; width: 85%; max-width: 320px; aspect-ratio: 3/4;
            margin: 0 auto; overflow: hidden; border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); cursor: pointer; 
            background: #ddd; display: flex; align-items: center; justify-content: center; 
            /* 모바일 드래그 방지 */
            -webkit-user-drag: none; user-select: none;
        }
        
        #target-photo { 
            width: 100%; height: 100%; object-fit: cover; pointer-events: none; 
        }
        
        .error-text { 
            position: absolute; color: #d32f2f; font-weight: bold; 
            font-size: 1.1rem; display: none; text-align: center; padding: 20px;
        }

        #ui-panel { 
            margin-top: 20px; width: 90%; max-width: 400px; 
            background: white; padding: 15px; border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); box-sizing: border-box;
        }

        .level-text { font-size: 1.3rem; font-weight: bold; margin: 0 0 10px 0; color: #1976d2; }
        
        .bar-bg { 
            width: 100%; height: 20px; background: #eee; 
            border-radius: 10px; overflow: hidden; margin: 5px 0 15px 0; 
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        #exp-bar { 
            width: 0%; height: 100%; background: linear-gradient(90deg, #4caf50, #8bc34a); 
            transition: width 0.3s ease-out; 
        }
        
        .weapon-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        }
        .weapon-btn { 
            padding: 12px 10px; border: none; border-radius: 10px; 
            cursor: pointer; font-size: 15px; font-weight: bold; 
            transition: all 0.2s; background: #e0e0e0; color: #9e9e9e; 
            display: flex; flex-direction: column; align-items: center;
        }
        .weapon-btn.unlocked { background: #ffb74d; color: #fff; box-shadow: 0 4px 0 #f57c00; }
        .weapon-btn.unlocked:active { transform: translateY(4px); box-shadow: 0 0 0 #f57c00; }
        .weapon-btn.active { background: #e65100; color: white; box-shadow: 0 4px 0 #bf360c; outline: 3px solid #ffcc80; }
        
        /* 타격 이펙트 애니메이션 */
        .hit-effect { 
            position: absolute; font-size: 2.5rem; font-weight: 900; 
            color: #fff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 3px 3px 0 #f44336; 
            pointer-events: none; animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; 
            z-index: 10;
        }
        @keyframes popUp { 
            0% { transform: scale(0.5) translate(-50%, -50%) rotate(-10deg); opacity: 1; } 
            50% { transform: scale(1.5) translate(-50%, -100%) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) translate(-50%, -150%) rotate(0deg); opacity: 0; } 
        }
        
        /* 흔들림 효과 */
        .shake { animation: shakeAnim 0.15s; }
        .shake-heavy { animation: shakeHeavyAnim 0.3s; }
        @keyframes shakeAnim { 
            0% { transform: translate(0, 0); } 
            25% { transform: translate(-8px, 4px); } 
            50% { transform: translate(8px, -4px); } 
            75% { transform: translate(-8px, -4px); } 
            100% { transform: translate(0, 0); } 
        }
        @keyframes shakeHeavyAnim { 
            0% { transform: translate(0, 0) scale(1); filter: brightness(1); } 
            20% { transform: translate(-15px, 10px) scale(0.95); filter: brightness(1.5) invert(0.2); } 
            40% { transform: translate(15px, -10px) scale(1.05); filter: brightness(0.8) invert(0.5); } 
            60% { transform: translate(-15px, -10px) scale(0.95); filter: brightness(1.2); } 
            80% { transform: translate(15px, 10px) scale(1.05); } 
            100% { transform: translate(0, 0) scale(1); filter: brightness(1); } 
        }
    </style>
</head>
<body>

    <h2>신희준 때리기 레벨업!</h2>
    
    <div id="game-container">
        <!-- ⭐️ 이미지를 클릭하면 타격 이벤트 발생 -->
        <div id="photo-container" onpointerdown="hit(event)">
            <span class="error-text" id="error-msg">사진을 불러올 수 없습니다<br><br><small>20260701_125816.jpg 파일이<br>깃허브에 있는지 확인하세요</small></span>
            <!-- ⭐️ 깃허브에 올린 파일명과 일치시켰습니다 -->
            <img id="target-photo" src="20260701_125816.jpg" alt="신희준 타겟 이미지" onerror="handleImageError()">
        </div>
    </div>

    <div id="ui-panel">
        <p class="level-text">🏆 Level: <span id="level-display">1</span></p>
        <div class="bar-bg"><div id="exp-bar"></div></div>
        <p style="margin: 0 0 15px 0; font-size: 0.9rem; color: #555;">EXP: <span id="exp-display">0</span> / <span id="max-exp-display">10</span></p>
        
        <div class="weapon-grid">
            <button class="weapon-btn unlocked active" id="w1" onclick="selectWeapon(1, '맨손', 1)">
                <span style="font-size: 24px;">🖐️</span> 맨손 (기본)
            </button>
            <button class="weapon-btn" id="w2" onclick="selectWeapon(2, '권투글러브', 3)">
                <span style="font-size: 24px;">🥊</span> 글러브 (Lv.2)
            </button>
            <button class="weapon-btn" id="w3" onclick="selectWeapon(3, '뿅망치', 6)">
                <span style="font-size: 24px;">🔨</span> 뿅망치 (Lv.3)
            </button>
            <button class="weapon-btn" id="w4" onclick="selectWeapon(4, '프라이팬', 12)">
                <span style="font-size: 24px;">🍳</span> 프라이팬 (Lv.4)
            </button>
            <button class="weapon-btn" id="w5" onclick="selectWeapon(5, '핵꿀밤', 30)" style="grid-column: span 2;">
                <span style="font-size: 24px;">🔥</span> 궁극기: 핵꿀밤 (Lv.5)
            </button>
        </div>
    </div>

    <script>
        let level = 1;
        let exp = 0;
        let maxExp = 10;
        let currentDamage = 1;
        let activeWeaponId = 1;

        // 브라우저 내장 합성음(사운드) 생성기
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            initAudio();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            const now = audioCtx.currentTime;
            
            if (type === 1) { // 맨손 (찰싹!)
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
                gainNode.gain.setValueAtTime(1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 2) { // 글러브 (퍽!)
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.2);
                gainNode.gain.setValueAtTime(1.5, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            } else if (type === 3) { // 뿅망치 (뽀용!)
                osc.type = 'square';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.linearRampToValueAtTime(1200, now + 0.15);
                gainNode.gain.setValueAtTime(0.5, now);
                gainNode.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 4) { // 프라이팬 (깡!)
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(1200, now);
                osc.frequency.exponentialRampToValueAtTime(300, now + 0.25);
                gainNode.gain.setValueAtTime(1, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now); osc.stop(now + 0.25);
            } else { // 핵꿀밤 (콰광!)
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.5);
                gainNode.gain.setValueAtTime(2, now);
                gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.start(now); osc.stop(now + 0.5);
            }
        }

        function handleImageError() {
            document.getElementById('target-photo').style.display = 'none';
            document.getElementById('error-msg').style.display = 'block';
        }

        function updateUI() {
            document.getElementById('level-display').innerText = level;
            document.getElementById('exp-display').innerText = exp;
            document.getElementById('max-exp-display').innerText = maxExp;
            document.getElementById('exp-bar').style.width = (exp / maxExp * 100) + '%';

            // 레벨에 따른 무기 해금
            if(level >= 2) document.getElementById('w2').classList.add('unlocked');
            if(level >= 3) document.getElementById('w3').classList.add('unlocked');
            if(level >= 4) document.getElementById('w4').classList.add('unlocked');
            if(level >= 5) document.getElementById('w5').classList.add('unlocked');
        }

        function selectWeapon(reqLevel, name, damage) {
            if (level < reqLevel) {
                alert(`레벨 ${reqLevel}에 도달해야 잠금이 해제됩니다!`);
                return;
            }
            currentDamage = damage;
            activeWeaponId = reqLevel;

            document.querySelectorAll('.weapon-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('w' + reqLevel).classList.add('active');
        }

        function hit(e) {
            initAudio(); // 첫 터치 시 오디오 활성화
            playSound(activeWeaponId);

            // 경험치 증가 로직
            exp += currentDamage;
            if (exp >= maxExp) {
                level++;
                exp = exp - maxExp; // 초과된 경험치 이월
                maxExp = Math.floor(maxExp * 1.6); // 다음 레벨 필요 경험치 증가
                
                // 레벨업 축하 효과
                setTimeout(() => alert(`🎉 축하합니다! 레벨 ${level} 달성! 새로운 무기를 확인해보세요.`), 100);
            }
            updateUI();

            // 사진 흔들림 효과 (무기에 따라 흔들림 강도 다름)
            const container = document.getElementById('photo-container');
            container.classList.remove('shake', 'shake-heavy');
            void container.offsetWidth; // 애니메이션 리셋 트릭
            
            if (activeWeaponId >= 4) {
                container.classList.add('shake-heavy');
            } else {
                container.classList.add('shake');
            }

            // 타격 글씨 이펙트 생성
            const rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            // 모바일 터치 이벤트 보정
            if (e.touches && e.touches.length > 0) {
                x = e.touches[0].clientX - rect.left;
                y = e.touches[0].clientY - rect.top;
            }

            const effect = document.createElement('div');
            effect.className = 'hit-effect';
            effect.style.left = x + 'px';
            effect.style.top = y + 'px';
            
            // 무기별 타격 텍스트 다르게
            let hitTexts = [];
            if(activeWeaponId === 1) hitTexts = ['찰싹!', '짝!'];
            else if(activeWeaponId === 2) hitTexts = ['퍽!', '팍!'];
            else if(activeWeaponId === 3) hitTexts = ['뽀용!', '뿅!'];
            else if(activeWeaponId === 4) hitTexts = ['깡!!', '까앙!'];
            else hitTexts = ['콰광!!!', '퍼억!!!', '크리티컬!'];

            effect.innerText = hitTexts[Math.floor(Math.random() * hitTexts.length)];
            
            container.appendChild(effect);
            
            // 이펙트 삭제
            setTimeout(() => effect.remove(), 600);
        }

        // 초기 세팅
        updateUI();
    </script>
</body>
</html>
