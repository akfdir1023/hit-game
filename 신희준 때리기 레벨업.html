<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>신희준 때리기 레벨업</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: white;
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        .title-font {
            font-family: 'Black Han Sans', sans-serif;
        }

        /* Screen Shake */
        @keyframes shake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-5px, 5px); }
            40% { transform: translate(5px, -5px); }
            60% { transform: translate(-5px, -5px); }
            80% { transform: translate(5px, 5px); }
            100% { transform: translate(0, 0); }
        }
        @keyframes heavyShake {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-15px, 15px) rotate(-2deg); }
            40% { transform: translate(15px, -15px) rotate(2deg); }
            60% { transform: translate(-15px, -15px) rotate(-2deg); }
            80% { transform: translate(15px, 15px) rotate(2deg); }
            100% { transform: translate(0, 0); }
        }
        .shake-active { animation: shake 0.15s cubic-bezier(.36,.07,.19,.97) both; }
        .shake-heavy { animation: heavyShake 0.3s cubic-bezier(.36,.07,.19,.97) both; }

        /* Floating Text Animations */
        @keyframes floatUp {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
            50% { transform: translate(-50%, -100%) scale(1.2); opacity: 1; }
            100% { transform: translate(-50%, -150%) scale(1); opacity: 0; }
        }
        .comic-text {
            position: absolute;
            pointer-events: none;
            animation: floatUp 0.6s ease-out forwards;
            font-family: 'Black Han Sans', sans-serif;
            z-index: 60;
            text-shadow: 3px 3px 0 #000, -3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000;
        }
        
        @keyframes expFloat {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-40px); opacity: 0; }
        }
        .exp-text {
            position: absolute;
            pointer-events: none;
            animation: expFloat 0.8s ease-out forwards;
            font-weight: 900;
            font-size: 1.2rem;
            color: #4ade80; /* green-400 */
            z-index: 55;
            text-shadow: 1px 1px 2px #000;
        }

        /* Face Container Physics */
        #faceContainer {
            transition: transform 0.05s ease-out, filter 0.1s;
            transform-style: preserve-3d;
            perspective: 1000px;
        }

        /* Level Up Flash */
        @keyframes levelUpFlash {
            0% { background-color: rgba(255, 255, 255, 0); }
            20% { background-color: rgba(255, 255, 255, 0.9); }
            100% { background-color: rgba(255, 255, 255, 0); }
        }
        .level-up-flash {
            animation: levelUpFlash 0.8s ease-out forwards;
        }
        
        @keyframes scalePop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.5); opacity: 1; }
            100% { transform: scale(1); opacity: 0; }
        }
        .level-up-text {
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
            opacity: 0;
        }
        .level-up-text.show {
            animation: scalePop 1.5s ease-out forwards;
        }

        /* Button States */
        .weapon-btn {
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .weapon-btn.locked {
            filter: grayscale(100%) brightness(0.5);
            pointer-events: none;
        }
        .weapon-btn.locked::after {
            content: '🔒';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.5rem;
            z-index: 10;
        }
        .weapon-btn.active {
            border-color: #3b82f6; /* blue-500 */
            background-color: rgba(59, 130, 246, 0.2);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
            transform: scale(1.05);
        }
        
        /* Progress Bar Striping */
        .progress-striped {
            background-image: linear-gradient(45deg, rgba(255,255,255,.15) 25%, transparent 25%, transparent 50%, rgba(255,255,255,.15) 50%, rgba(255,255,255,.15) 75%, transparent 75%, transparent);
            background-size: 1rem 1rem;
            animation: progress-stripes 1s linear infinite;
        }
        @keyframes progress-stripes {
            from { background-position: 1rem 0; }
            to { background-position: 0 0; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-screen relative bg-slate-900 overflow-hidden" id="gameBody">

    <!-- FX Overlays -->
    <div id="flashOverlay" class="absolute inset-0 pointer-events-none z-50"></div>
    <div id="levelUpText" class="level-up-text title-font text-6xl text-transparent bg-clip-text bg-gradient-to-b from-yellow-300 to-yellow-600 drop-shadow-[0_5px_5px_rgba(0,0,0,0.8)] whitespace-nowrap">
        LEVEL UP!
    </div>

    <!-- Header -->
    <header class="w-full max-w-md p-4 flex flex-col items-center gap-2 z-30 pt-6">
        <h1 class="title-font text-4xl sm:text-5xl text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400 drop-shadow-lg text-center tracking-wide">
            신희준 때리기
        </h1>
        <p class="text-sm font-bold text-emerald-300 bg-emerald-900/50 px-3 py-1 rounded-full border border-emerald-700/50 shadow-inner">
            스트레스 해소 레벨업 아케이드!
        </p>
        
        <label for="imageUpload" class="mt-2 cursor-pointer bg-slate-800 hover:bg-slate-700 border border-slate-600 rounded-full px-4 py-2 text-sm flex items-center gap-2 transition shadow-lg text-slate-200">
            <span>📸</span> <span>내 사진으로 바꾸기</span>
            <input type="file" id="imageUpload" accept="image/*" class="hidden">
        </label>
    </header>

    <!-- Main Game Area -->
    <main class="flex-1 w-full flex flex-col items-center justify-center relative z-20 w-full max-w-md px-4">
        
        <!-- Level & EXP Info -->
        <div class="w-full mb-6 relative">
            <div class="flex justify-between items-end mb-2">
                <div class="flex items-baseline gap-2">
                    <span class="text-yellow-400 title-font text-3xl drop-shadow-md">LV <span id="levelText">1</span></span>
                </div>
                <div class="text-right">
                    <span class="text-slate-300 font-bold text-sm">EXP </span>
                    <span id="expText" class="text-white title-font text-xl">0 / 20</span>
                </div>
            </div>
            <!-- EXP Bar -->
            <div class="w-full h-8 bg-slate-800 border-2 border-slate-600 rounded-2xl overflow-hidden relative shadow-[0_0_15px_rgba(0,0,0,0.5)]">
                <div id="expBar" class="h-full bg-gradient-to-r from-blue-500 to-cyan-400 transition-all duration-300 progress-striped w-0"></div>
            </div>
        </div>

        <!-- Target Face Area -->
        <div class="relative w-64 h-64 sm:w-72 sm:h-72 cursor-crosshair mt-2" id="targetArea">
            <div id="faceContainer" class="w-full h-full rounded-full overflow-hidden border-8 border-slate-700 shadow-[0_10px_40px_rgba(0,0,0,0.7)] relative bg-slate-800">
                <img id="targetImage" src="4914_2.jpg" alt="타겟" class="w-full h-full object-cover select-none pointer-events-none" draggable="false">
                
                <!-- Damage Flash Overlay (Inner) -->
                <div id="hitFlash" class="absolute inset-0 bg-white opacity-0 pointer-events-none transition-opacity duration-100 mix-blend-overlay"></div>
            </div>
            
            <!-- Container for sparks, numbers, floating text -->
            <div id="fxContainer" class="absolute inset-0 pointer-events-none z-40 overflow-visible"></div>
        </div>
        
    </main>

    <!-- Weapon Selector / Inventory -->
    <footer class="w-full max-w-md p-4 pb-8 z-30 bg-slate-900/80 backdrop-blur-sm rounded-t-3xl border-t border-slate-700">
        <p class="text-center text-sm text-slate-400 mb-3 font-bold tracking-wide">무기 인벤토리 (레벨업하여 해제)</p>
        <div class="grid grid-cols-3 gap-3" id="weaponGrid">
            <!-- Rendered by JS -->
        </div>
    </footer>

    <!-- Scripts -->
    <script>
        // --- Game Config & Data ---
        let level = 1;
        let currentExp = 0;
        let expToNextLevel = 20;

        // Weapons Configuration
        const weapons = [
            { id: 'slap',    name: '찰싹 뺨때리기', unlockLevel: 1, exp: 1,   icon: '🖐️', color: '#ef4444', text: '찰싹!', size: 'text-4xl' },
            { id: 'hammer',  name: '뿅망치',       unlockLevel: 2, exp: 3,   icon: '🔨', color: '#facc15', text: '뾰용!', size: 'text-5xl' },
            { id: 'pan',     name: '단단한 프라이팬',unlockLevel: 3, exp: 7,   icon: '🍳', color: '#94a3b8', text: '깡!!',   size: 'text-5xl' },
            { id: 'water',   name: '시원한 물바가지',unlockLevel: 4, exp: 15,  icon: '🪣', color: '#38bdf8', text: '촥!!',   size: 'text-6xl' },
            { id: 'zap',     name: '백만볼트 번개',  unlockLevel: 5, exp: 30,  icon: '⚡', color: '#fbbf24', text: '찌릿!!', size: 'text-6xl' },
            { id: 'meteor',  name: '분노의 메테오',  unlockLevel: 6, exp: 100, icon: '☄️', color: '#dc2626', text: '콰쾅!!!', size: 'text-7xl' }
        ];
        
        let currentWeaponId = 'slap';

        // --- DOM Elements ---
        const gameBody = document.getElementById('gameBody');
        const faceContainer = document.getElementById('faceContainer');
        const targetArea = document.getElementById('targetArea');
        const targetImage = document.getElementById('targetImage');
        
        const levelText = document.getElementById('levelText');
        const expText = document.getElementById('expText');
        const expBar = document.getElementById('expBar');
        
        const fxContainer = document.getElementById('fxContainer');
        const flashOverlay = document.getElementById('flashOverlay');
        const levelUpTextEl = document.getElementById('levelUpText');
        const hitFlash = document.getElementById('hitFlash');
        const weaponGrid = document.getElementById('weaponGrid');
        
        const imageUpload = document.getElementById('imageUpload');

        // --- Web Audio API (Synthesizers) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Generate procedural sound effects based on weapon
        function playSound(weaponId) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;

            if (weaponId === 'slap') {
                // High pitch noise burst
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.1);
                gain.gain.setValueAtTime(0.3, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.1);
            } 
            else if (weaponId === 'hammer') {
                // Squeaky Toy: Sine wave frequency modulation up and down
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, t);
                osc.frequency.linearRampToValueAtTime(800, t + 0.05);
                osc.frequency.linearRampToValueAtTime(300, t + 0.15);
                gain.gain.setValueAtTime(0.4, t);
                gain.gain.linearRampToValueAtTime(0.6, t + 0.05);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.2);
            } 
            else if (weaponId === 'pan') {
                // Metallic Clang: Multiple oscillators, inharmonic frequencies
                const osc1 = audioCtx.createOscillator();
                const osc2 = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc1.type = 'square'; osc2.type = 'triangle';
                osc1.frequency.setValueAtTime(500, t);
                osc2.frequency.setValueAtTime(820, t);
                osc1.frequency.exponentialRampToValueAtTime(200, t + 0.3);
                gain.gain.setValueAtTime(0.5, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.5);
                osc1.connect(gain); osc2.connect(gain);
                gain.connect(audioCtx.destination);
                osc1.start(t); osc2.start(t);
                osc1.stop(t + 0.5); osc2.stop(t + 0.5);
            } 
            else if (weaponId === 'water') {
                // Splash: Filtered noise representation
                const bufferSize = audioCtx.sampleRate * 0.3; // 0.3 seconds
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1; // White noise
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;
                
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1000, t);
                filter.frequency.exponentialRampToValueAtTime(100, t + 0.2);
                
                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.6, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
                
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(t);
            } 
            else if (weaponId === 'zap') {
                // Electric shock: Sawtooth with rapid volume flutter
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, t);
                osc.frequency.linearRampToValueAtTime(50, t + 0.3);
                
                gain.gain.setValueAtTime(0.6, t);
                // Flutter effect
                for(let i=0; i<10; i++) {
                    gain.gain.linearRampToValueAtTime(0.1, t + (i*0.03));
                    gain.gain.linearRampToValueAtTime(0.6, t + (i*0.03) + 0.015);
                }
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.35);
            } 
            else if (weaponId === 'meteor') {
                // Explosion/Impact: Low freq synth + heavy distortion
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(100, t);
                osc.frequency.exponentialRampToValueAtTime(10, t + 0.8);
                
                gain.gain.setValueAtTime(1, t);
                gain.gain.exponentialRampToValueAtTime(0.01, t + 0.8);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(t); osc.stop(t + 0.8);
            }
        }

        // --- Core Logic ---

        function getExpRequirement(lvl) {
            // EXP scaling curve
            if (lvl === 1) return 20;
            if (lvl === 2) return 100;
            if (lvl === 3) return 300;
            if (lvl === 4) return 1000;
            if (lvl === 5) return 3000;
            return Math.floor(3000 * Math.pow(1.5, lvl - 5)); // Scales infinitely after lv6
        }

        function renderUI() {
            // Update Text
            levelText.innerText = level;
            expText.innerText = `${currentExp} / ${expToNextLevel}`;
            
            // Update Progress bar
            let percent = (currentExp / expToNextLevel) * 100;
            if(percent > 100) percent = 100;
            expBar.style.width = `${percent}%`;
            
            // Generate/Update Weapon Buttons
            weaponGrid.innerHTML = '';
            weapons.forEach(w => {
                const isUnlocked = level >= w.unlockLevel;
                const isActive = currentWeaponId === w.id;
                
                const btn = document.createElement('button');
                btn.className = `weapon-btn flex flex-col items-center justify-center p-3 rounded-2xl bg-slate-800 border-2 border-slate-600 shadow-md ${!isUnlocked ? 'locked' : ''} ${isActive ? 'active' : ''}`;
                btn.onclick = () => selectWeapon(w.id);
                
                btn.innerHTML = `
                    <span class="text-3xl sm:text-4xl mb-1 drop-shadow-md">${w.icon}</span>
                    <span class="text-[11px] sm:text-xs font-bold whitespace-nowrap text-slate-200">${w.name}</span>
                    <span class="text-[10px] text-emerald-400 mt-1">+${w.exp} EXP</span>
                `;
                weaponGrid.appendChild(btn);
            });
        }

        function selectWeapon(id) {
            const w = weapons.find(wx => wx.id === id);
            if (level >= w.unlockLevel) {
                currentWeaponId = id;
                renderUI();
            }
        }

        function triggerLevelUp() {
            level++;
            currentExp = currentExp - expToNextLevel; // Carry over excess
            expToNextLevel = getExpRequirement(level);
            
            // Level Up Visuals
            flashOverlay.classList.remove('level-up-flash');
            void flashOverlay.offsetWidth; // trigger reflow
            flashOverlay.classList.add('level-up-flash');
            
            levelUpTextEl.classList.remove('show');
            void levelUpTextEl.offsetWidth;
            levelUpTextEl.classList.add('show');
            
            // Special sound for level up (simple harmonious chime)
            if(audioCtx) {
                const t = audioCtx.currentTime;
                [400, 500, 600, 800].forEach((freq, i) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, t + (i*0.1));
                    gain.gain.setValueAtTime(0, t);
                    gain.gain.linearRampToValueAtTime(0.3, t + (i*0.1));
                    gain.gain.exponentialRampToValueAtTime(0.01, t + (i*0.1) + 0.5);
                    osc.connect(gain); gain.connect(audioCtx.destination);
                    osc.start(t); osc.stop(t + 1);
                });
            }

            // Auto-select newly unlocked weapon if applicable
            const newWeapon = weapons.find(w => w.unlockLevel === level);
            if (newWeapon) {
                currentWeaponId = newWeapon.id;
            }

            renderUI();
        }

        function createHitVisuals(x, y, weapon) {
            // Comic Text (Onomatopoeia)
            const textEl = document.createElement('div');
            textEl.className = `comic-text ${weapon.size}`;
            textEl.style.left = `${x}px`;
            textEl.style.top = `${y}px`;
            textEl.style.color = weapon.color;
            textEl.innerText = weapon.text;
            fxContainer.appendChild(textEl);

            // Floating EXP Number
            const expEl = document.createElement('div');
            expEl.className = 'exp-text';
            expEl.style.left = `${x + (Math.random()*40 - 20)}px`;
            expEl.style.top = `${y - 30}px`;
            expEl.innerText = `+${weapon.exp}`;
            fxContainer.appendChild(expEl);

            // Inner Face Flash
            hitFlash.style.opacity = '0.5';
            setTimeout(() => { hitFlash.style.opacity = '0'; }, 100);

            // Cleanup
            setTimeout(() => {
                textEl.remove();
                expEl.remove();
            }, 1000);
        }

        function applyPhysics(x, y, rect, weapon) {
            const relX = ((x / rect.width) - 0.5) * 2;
            const relY = ((y / rect.height) - 0.5) * 2;
            
            // Squash and Stretch + Rotation
            const rotateX = relY * -40; 
            const rotateY = relX * 40;
            
            faceContainer.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(0.85)`;
            
            setTimeout(() => {
                faceContainer.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) scale(1)';
            }, 150);

            // Screen Shake
            gameBody.classList.remove('shake-active', 'shake-heavy');
            void gameBody.offsetWidth; 
            if (weapon.exp >= 15) { // Heavy shake for high exp weapons
                gameBody.classList.add('shake-heavy');
            } else {
                gameBody.classList.add('shake-active');
            }
        }

        function hitTarget(e) {
            initAudio(); // Required for browsers to allow sound on interaction

            const weapon = weapons.find(w => w.id === currentWeaponId);
            if (!weapon) return;

            // Calculate hit position relative to target container
            const rect = targetArea.getBoundingClientRect();
            
            // Support both mouse and touch coordinates
            let clientX = e.clientX;
            let clientY = e.clientY;
            
            if(e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            }

            let hitX = clientX - rect.left;
            let hitY = clientY - rect.top;

            // Constrain hit visuals inside container approx
            hitX = Math.max(20, Math.min(rect.width - 20, hitX));
            hitY = Math.max(20, Math.min(rect.height - 20, hitY));

            // Apply mechanics
            currentExp += weapon.exp;
            playSound(weapon.id);
            createHitVisuals(hitX, hitY, weapon);
            applyPhysics(hitX, hitY, rect, weapon);

            // Check Level Up
            if (currentExp >= expToNextLevel) {
                triggerLevelUp();
            } else {
                renderUI();
            }
        }

        // --- Event Listeners ---
        
        // Prevent default touch behaviors like scrolling while rapidly tapping
        targetArea.addEventListener('touchstart', (e) => {
            e.preventDefault(); 
            hitTarget(e);
        }, {passive: false});

        targetArea.addEventListener('mousedown', (e) => {
            e.preventDefault();
            hitTarget(e);
        });

        // Image Upload Logic
        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    targetImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Init UI
        renderUI();

    </script>
</body>
</html>
